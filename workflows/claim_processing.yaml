name: claim_processing
version: "1.0.0"
description: >-
  Insurance claim intake with document verification. Shows a dependency whose
  exhausted retries degrade into manual review instead of an outright failure.
input_schema:
  type: object
  additionalProperties: false
  required: [policy_id, claim_amount, claimant, documents]
  properties:
    policy_id:
      type: string
      pattern: "^POL-[0-9]{6}$"
    claim_amount:
      type: number
      minimum: 1
      maximum: 100000
    claimant:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    documents:
      type: array
      minItems: 1
      items:
        type: object
        required: [type, reference]
        properties:
          type: {type: string}
          reference: {type: string, minLength: 1}
    incident_date:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
retry:
  workflow_backoff_seconds: 2
  max_workflow_attempts: 3
stages:
  - name: eligibility
    description: Fast, deterministic checks before spending a dependency call.
    rules:
      - id: claim_ceiling
        severity: high
        mode: assert
        condition:
          field: claim_amount
          op: lte
          value: 100000
        effect: reject
        reason: Claim exceeds the 100,000 policy ceiling
      - id: documents_present
        severity: medium
        mode: assert
        condition:
          field: documents
          op: len_gte
          value: 1
        effect: reject
        reason: At least one supporting document is required
      - id: large_claim_review
        severity: medium
        mode: guard
        condition:
          field: claim_amount
          op: gt
          value: 25000
        effect: manual_review
        reason: Claims above 25,000 require a human adjuster

  - name: document_verification
    description: External verification; degraded service routes to manual review.
    dependency:
      connector: document_verifier
      operation: verify
      timeout_ms: 300
      retry:
        max_attempts: 3
        base_delay_ms: 5
        max_delay_ms: 50
      failure_policy: manual_review
      result:
        verified: true
        provider: sim-document-verifier
        document_count: "$input.documents"
    rules:
      - id: documents_verified
        severity: high
        mode: assert
        condition:
          field: dependencies.document_verifier.verified
          op: eq
          value: true
        effect: manual_review
        reason: Documents could not be verified automatically

  - name: payout
    description: Final policy and amount checks before settlement.
    rules:
      - id: incident_declared
        severity: low
        mode: assert
        condition:
          field: incident_date
          op: exists
        effect: manual_review
        reason: Incident date is required before payout
      - id: policy_prefix
        severity: low
        mode: assert
        condition:
          field: policy_id
          op: matches
          value: "^POL-"
        effect: reject
        reason: Policy identifier has an unrecognised format
